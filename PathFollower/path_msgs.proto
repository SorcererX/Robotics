syntax = "proto3";
package path_msgs;

// Distances are in cm along the middle of the robot, angles are the change of heading in degrees with
// counter-clockwise (left) as positive. Turns and arcs use path_follower.track_width_cm from sepia.yaml.

// Straight ahead, negative is backward.
message Line
{
    double distance_cm = 1;
}

// Turns on the spot.
message Turn
{
    double angle_deg = 1;
}

// Drives along a circle until the heading has changed by angle_deg. The circle is on the left for a positive
// angle and on the right for a negative one. A radius below half the track width runs the inner belt backward.
message Arc
{
    double radius_cm = 1;
    double angle_deg = 2;
    bool backward = 3;
}

message PathSegment
{
    oneof segment
    {
        Line line = 1;
        Turn turn = 2;
        Arc arc = 3;
    }
    // Replaces the speed of the path for this segment when above 0.
    double speed_cm_s = 4;
}

// Drives the segments one after the other. The next segment is queued in the motor controller, so it starts
// as soon as the one before it ends. Each segment starts from the target of the one before it, so errors do
// not add up.
message FollowPath
{
    // Returned in PathProgress.
    uint32 id = 1;
    repeated PathSegment segments = 2;
    // Of the faster belt, the other belt is slowed down so both finish the segment together.
    double speed_cm_s = 3;
    double acceleration_cm_s2 = 4;
    // Adds the segments after the running path instead of stopping it.
    bool append = 5;
}

// Stops the running and waiting paths.
message StopPath
{
    // The acceleration of the running path is used when 0.
    double deceleration_cm_s2 = 1;
}

// Where the robot is, worked out from the belt positions. Sent with each MoveStatus while a path runs.
// Measured from where the robot was when the path started, x forward and y to the left. Appended paths
// continue from the start of the path they were appended to.
message PathPose
{
    uint32 id = 1;
    // With the heading from the IMU when imu_heading is set, otherwise the same as the encoder pose.
    double x_cm = 2;
    double y_cm = 3;
    // Counter-clockwise from x.
    double heading_deg = 4;
    // From the belts alone, the heading from the difference between them. Turns the belts slip on are counted in
    // full, so comparing it with the pose above shows the slip.
    double encoder_x_cm = 5;
    double encoder_y_cm = 6;
    double encoder_heading_deg = 7;
    bool imu_heading = 8;
}

// Sent when a segment starts and when a path ends.
message PathProgress
{
    enum State
    {
        RUNNING = 0;
        DONE = 1;
        // By StopPath, or by a FollowPath that was not appended.
        STOPPED = 2;
        FAILED = 3;
    }
    uint32 id = 1;
    State state = 2;
    // The segment that is running, or the last one when the path has ended.
    uint32 segment = 3;
    uint32 segment_count = 4;
    // Why the path stopped or failed.
    string message = 5;
}

// How PathFollower drives. It starts with the values in sepia.yaml, changes are kept until it restarts.
message FollowerSettings
{
    // Middle to middle of the belts. Turns and arcs need it, 0 allows only lines. A path that is running keeps
    // the belt targets it was planned with, its heading corrections and pose use a changed value at once.
    double track_width_cm = 1;
    // How close the belts must get to a segment's end before the next one counts as started.
    double tolerance_cm = 2;
    // Check the heading after turns and arcs with ImuData, and correct it by turning on the spot.
    bool use_imu = 3;
    double heading_tolerance_deg = 4;
    uint32 max_heading_corrections = 5;
    // After a turn or arc, the heading is checked when the turn rate has stayed below calm_rate_deg_s for
    // calm_time_s, or after settle_timeout_s.
    double calm_rate_deg_s = 6;
    double calm_time_s = 7;
    double settle_timeout_s = 8;
}

message RequestFollowerSettings
{
    int32 time = 1;
}

// All values are checked before any is used, so a bad value changes nothing.
message WriteFollowerSettings
{
    FollowerSettings settings = 1;
}

// Sent when PathFollower starts and after each request or write.
message FollowerSettingsReport
{
    FollowerSettings settings = 1;
    // What was done, or why the write was refused.
    string result = 2;
}
